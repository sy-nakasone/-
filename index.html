<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドラえもん おみくじ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #00BFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #0066CC;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .result-area {
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .character-icon {
            margin-bottom: 20px;
            animation: bounce 0.5s ease;
        }

        .character-icon svg {
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }

        .character-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fortune {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px 30px;
            border-radius: 10px;
            display: inline-block;
        }

        .message {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .fortune-daikichi { color: #FFD700; background: linear-gradient(135deg, #FFF8DC, #FFFACD); border: 2px solid #FFD700; }
        .fortune-chukichi { color: #FF6B6B; background: linear-gradient(135deg, #FFE4E1, #FFF0F5); border: 2px solid #FF6B6B; }
        .fortune-kichi { color: #FF69B4; background: linear-gradient(135deg, #FFF0F5, #FFE4E1); border: 2px solid #FF69B4; }
        .fortune-shokichi { color: #4169E1; background: linear-gradient(135deg, #E6E6FA, #F0F8FF); border: 2px solid #4169E1; }
        .fortune-kyo { color: #8B4513; background: linear-gradient(135deg, #F5DEB3, #FFE4C4); border: 2px solid #8B4513; }
        .fortune-daikyo { color: #4B0082; background: linear-gradient(135deg, #E6E6FA, #DDA0DD); border: 2px solid #4B0082; }

        .draw-button {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            margin-top: 20px;
        }

        .draw-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .initial-message {
            color: #888;
            font-size: 1.2em;
        }

        .initial-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .shaking {
            animation: shake 0.3s ease 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎍 ドラえもん おみくじ 🎍</h1>
        <p class="subtitle">ボタンを押して今日の運勢を占おう！</p>
        
        <div class="result-area" id="resultArea">
            <div class="initial-icon">🎋</div>
            <p class="initial-message">おみくじを引いてね！</p>
        </div>
        
        <button class="draw-button" id="drawBtn" onclick="drawOmikuji()">おみくじを引く</button>
    </div>

    <script>
        // ドラえもん（青い猫型ロボット）
        const doraemonSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 顔の輪郭（青） -->
            <circle cx="75" cy="75" r="65" fill="#00A0E9" stroke="#0080C0" stroke-width="3"/>
            <!-- 白い顔部分 -->
            <ellipse cx="75" cy="85" rx="50" ry="45" fill="white"/>
            <!-- 目（白い部分） -->
            <ellipse cx="60" cy="55" rx="18" ry="22" fill="white" stroke="#333" stroke-width="2"/>
            <ellipse cx="90" cy="55" rx="18" ry="22" fill="white" stroke="#333" stroke-width="2"/>
            <!-- 目（黒い部分） -->
            <circle cx="65" cy="58" r="8" fill="#333"/>
            <circle cx="85" cy="58" r="8" fill="#333"/>
            <!-- 目のハイライト -->
            <circle cx="67" cy="55" r="3" fill="white"/>
            <circle cx="87" cy="55" r="3" fill="white"/>
            <!-- 赤い鼻 -->
            <circle cx="75" cy="80" r="12" fill="#E60012" stroke="#C00" stroke-width="2"/>
            <ellipse cx="72" cy="77" rx="4" ry="3" fill="#FF6666" opacity="0.6"/>
            <!-- 鼻から下の線 -->
            <line x1="75" y1="92" x2="75" y2="105" stroke="#333" stroke-width="2"/>
            <!-- 口 -->
            <path d="M 45 105 Q 75 130 105 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- ヒゲ（左） -->
            <line x1="15" y1="75" x2="45" y2="80" stroke="#333" stroke-width="2"/>
            <line x1="15" y1="90" x2="45" y2="90" stroke="#333" stroke-width="2"/>
            <line x1="15" y1="105" x2="45" y2="100" stroke="#333" stroke-width="2"/>
            <!-- ヒゲ（右） -->
            <line x1="135" y1="75" x2="105" y2="80" stroke="#333" stroke-width="2"/>
            <line x1="135" y1="90" x2="105" y2="90" stroke="#333" stroke-width="2"/>
            <line x1="135" y1="105" x2="105" y2="100" stroke="#333" stroke-width="2"/>
            <!-- 首輪 -->
            <rect x="45" y="130" width="60" height="12" rx="3" fill="#E60012"/>
            <!-- 鈴 -->
            <circle cx="75" cy="142" r="10" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
            <line x1="75" y1="145" x2="75" y2="150" stroke="#DAA520" stroke-width="2"/>
        </svg>`;

        // のび太（メガネの男の子）
        const nobitaSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 髪の毛 -->
            <ellipse cx="75" cy="40" rx="45" ry="30" fill="#333"/>
            <circle cx="50" cy="35" r="12" fill="#333"/>
            <circle cx="100" cy="35" r="12" fill="#333"/>
            <!-- 顔 -->
            <ellipse cx="75" cy="80" rx="45" ry="50" fill="#FFE4C4" stroke="#DEB887" stroke-width="2"/>
            <!-- メガネフレーム -->
            <ellipse cx="55" cy="70" rx="22" ry="18" fill="white" stroke="#333" stroke-width="3"/>
            <ellipse cx="95" cy="70" rx="22" ry="18" fill="white" stroke="#333" stroke-width="3"/>
            <line x1="77" y1="70" x2="73" y2="70" stroke="#333" stroke-width="3"/>
            <line x1="33" y1="70" x2="20" y2="65" stroke="#333" stroke-width="3"/>
            <line x1="117" y1="70" x2="130" y2="65" stroke="#333" stroke-width="3"/>
            <!-- 目 -->
            <circle cx="55" cy="72" r="6" fill="#333"/>
            <circle cx="95" cy="72" r="6" fill="#333"/>
            <circle cx="57" cy="70" r="2" fill="white"/>
            <circle cx="97" cy="70" r="2" fill="white"/>
            <!-- 鼻 -->
            <ellipse cx="75" cy="90" rx="4" ry="3" fill="#DEB887"/>
            <!-- 口（笑顔） -->
            <path d="M 60 105 Q 75 120 90 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- ほっぺ -->
            <ellipse cx="40" cy="95" rx="8" ry="5" fill="#FFB6C1" opacity="0.5"/>
            <ellipse cx="110" cy="95" rx="8" ry="5" fill="#FFB6C1" opacity="0.5"/>
            <!-- 服（黄色） -->
            <path d="M 35 130 Q 75 145 115 130 L 115 150 L 35 150 Z" fill="#FFD93D"/>
        </svg>`;

        // しずかちゃん（リボンの女の子）
        const shizukaSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 髪の毛 -->
            <ellipse cx="75" cy="55" rx="55" ry="45" fill="#8B4513"/>
            <ellipse cx="30" cy="80" rx="20" ry="35" fill="#8B4513"/>
            <ellipse cx="120" cy="80" rx="20" ry="35" fill="#8B4513"/>
            <!-- リボン -->
            <ellipse cx="50" cy="25" rx="18" ry="12" fill="#FF69B4"/>
            <ellipse cx="80" cy="25" rx="18" ry="12" fill="#FF69B4"/>
            <circle cx="65" cy="28" r="8" fill="#FF1493"/>
            <!-- 顔 -->
            <ellipse cx="75" cy="80" rx="40" ry="45" fill="#FFE4C4" stroke="#DEB887" stroke-width="2"/>
            <!-- 目 -->
            <ellipse cx="58" cy="75" rx="12" ry="15" fill="white" stroke="#333" stroke-width="2"/>
            <ellipse cx="92" cy="75" rx="12" ry="15" fill="white" stroke="#333" stroke-width="2"/>
            <circle cx="60" cy="78" r="7" fill="#333"/>
            <circle cx="94" cy="78" r="7" fill="#333"/>
            <!-- 目のキラキラ -->
            <circle cx="62" cy="75" r="3" fill="white"/>
            <circle cx="96" cy="75" r="3" fill="white"/>
            <circle cx="57" cy="80" r="1.5" fill="white"/>
            <circle cx="91" cy="80" r="1.5" fill="white"/>
            <!-- まつげ -->
            <path d="M 48 65 L 45 60" stroke="#333" stroke-width="2"/>
            <path d="M 52 63 L 50 58" stroke="#333" stroke-width="2"/>
            <path d="M 98 63 L 100 58" stroke="#333" stroke-width="2"/>
            <path d="M 102 65 L 105 60" stroke="#333" stroke-width="2"/>
            <!-- 鼻 -->
            <ellipse cx="75" cy="92" rx="3" ry="2" fill="#DEB887"/>
            <!-- 口 -->
            <path d="M 65 105 Q 75 115 85 105" fill="none" stroke="#E91E63" stroke-width="3" stroke-linecap="round"/>
            <!-- ほっぺ -->
            <ellipse cx="42" cy="95" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
            <ellipse cx="108" cy="95" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
            <!-- 服（ピンク） -->
            <path d="M 40 130 Q 75 145 110 130 L 115 150 L 35 150 Z" fill="#FF69B4"/>
        </svg>`;

        // スネ夫（とんがり頭）
        const suneoSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 特徴的な髪型 -->
            <polygon points="75,5 95,50 55,50" fill="#333"/>
            <polygon points="60,20 75,55 45,55" fill="#333"/>
            <polygon points="90,20 105,55 75,55" fill="#333"/>
            <ellipse cx="75" cy="55" rx="35" ry="15" fill="#333"/>
            <!-- 顔 -->
            <ellipse cx="75" cy="85" rx="38" ry="45" fill="#FFE4C4" stroke="#DEB887" stroke-width="2"/>
            <!-- 目（細め・ずる賢い感じ） -->
            <path d="M 45 75 Q 58 70 70 75" fill="none" stroke="#333" stroke-width="3"/>
            <path d="M 80 75 Q 92 70 105 75" fill="none" stroke="#333" stroke-width="3"/>
            <circle cx="57" cy="73" r="4" fill="#333"/>
            <circle cx="93" cy="73" r="4" fill="#333"/>
            <!-- 眉毛（上がり眉） -->
            <path d="M 45 65 L 70 60" stroke="#333" stroke-width="3"/>
            <path d="M 105 65 L 80 60" stroke="#333" stroke-width="3"/>
            <!-- 鼻（とがった感じ） -->
            <path d="M 75 80 L 78 95 L 72 95 Z" fill="#DEB887"/>
            <!-- 口（にやり） -->
            <path d="M 55 108 Q 75 115 95 108" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <path d="M 95 108 L 100 105" stroke="#333" stroke-width="2"/>
            <!-- 服（青） -->
            <path d="M 40 130 Q 75 145 110 130 L 115 150 L 35 150 Z" fill="#4169E1"/>
        </svg>`;

        // ジャイアン（がっしり）
        const gianSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 髪の毛（短め） -->
            <rect x="40" y="25" width="70" height="25" rx="5" fill="#333"/>
            <ellipse cx="75" cy="35" rx="40" ry="15" fill="#333"/>
            <!-- 顔（大きめ・丸い） -->
            <ellipse cx="75" cy="80" rx="50" ry="55" fill="#DEB887" stroke="#CD853F" stroke-width="3"/>
            <!-- 眉毛（太い・怒り気味） -->
            <path d="M 40 55 L 65 50" stroke="#333" stroke-width="5"/>
            <path d="M 110 55 L 85 50" stroke="#333" stroke-width="5"/>
            <!-- 目（小さめ・力強い） -->
            <circle cx="55" cy="70" r="8" fill="white" stroke="#333" stroke-width="2"/>
            <circle cx="95" cy="70" r="8" fill="white" stroke="#333" stroke-width="2"/>
            <circle cx="55" cy="70" r="5" fill="#333"/>
            <circle cx="95" cy="70" r="5" fill="#333"/>
            <!-- 鼻（大きめ） -->
            <ellipse cx="75" cy="90" rx="8" ry="6" fill="#CD853F"/>
            <!-- 口（大きく開いた） -->
            <ellipse cx="75" cy="115" rx="25" ry="15" fill="#8B0000"/>
            <rect x="55" y="108" width="40" height="8" fill="white"/>
            <!-- 服（オレンジ） -->
            <path d="M 30 135 Q 75 150 120 135 L 125 150 L 25 150 Z" fill="#FF8C00"/>
        </svg>`;

        // 先生（メガネ・厳しい）
        const senseiSVG = `
        <svg width="150" height="150" viewBox="0 0 150 150">
            <!-- 髪の毛（きっちり） -->
            <rect x="40" y="20" width="70" height="30" rx="5" fill="#333"/>
            <!-- 顔 -->
            <ellipse cx="75" cy="75" rx="42" ry="48" fill="#FFE4C4" stroke="#DEB887" stroke-width="2"/>
            <!-- メガネ -->
            <rect x="38" y="55" rx="5" width="32" height="28" fill="none" stroke="#333" stroke-width="3"/>
            <rect x="80" y="55" rx="5" width="32" height="28" fill="none" stroke="#333" stroke-width="3"/>
            <line x1="70" y1="69" x2="80" y2="69" stroke="#333" stroke-width="3"/>
            <line x1="38" y1="65" x2="25" y2="60" stroke="#333" stroke-width="3"/>
            <line x1="112" y1="65" x2="125" y2="60" stroke="#333" stroke-width="3"/>
            <!-- 目（厳しい） -->
            <line x1="48" y1="68" x2="60" y2="72" stroke="#333" stroke-width="3"/>
            <line x1="90" y1="72" x2="102" y2="68" stroke="#333" stroke-width="3"/>
            <circle cx="54" cy="70" r="3" fill="#333"/>
            <circle cx="96" cy="70" r="3" fill="#333"/>
            <!-- 眉毛（怒り） -->
            <path d="M 42 52 L 65 48" stroke="#333" stroke-width="4"/>
            <path d="M 108 52 L 85 48" stroke="#333" stroke-width="4"/>
            <!-- 鼻 -->
            <path d="M 75 75 L 78 90 L 72 90 Z" fill="#DEB887"/>
            <!-- 口（への字） -->
            <path d="M 55 105 L 75 100 L 95 105" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <!-- ネクタイ -->
            <polygon points="75,125 65,145 75,150 85,145" fill="#8B0000"/>
            <rect x="70" y="120" width="10" height="8" fill="#8B0000"/>
            <!-- 服（スーツ・グレー） -->
            <path d="M 35 130 L 45 150 L 25 150 Z" fill="#4a4a4a"/>
            <path d="M 115 130 L 105 150 L 125 150 Z" fill="#4a4a4a"/>
        </svg>`;

        const fortunes = [
            {
                svg: doraemonSVG,
                name: "ドラえもん",
                fortune: "大吉",
                fortuneClass: "fortune-daikichi",
                message: "すばらしい一日になるよ！ひみつ道具のように、あなたの可能性は無限大だ！"
            },
            {
                svg: nobitaSVG,
                name: "のび太",
                fortune: "中吉",
                fortuneClass: "fortune-chukichi",
                message: "のんびりいこう！失敗しても大丈夫、きっとうまくいくよ！"
            },
            {
                svg: shizukaSVG,
                name: "しずかちゃん",
                fortune: "吉",
                fortuneClass: "fortune-kichi",
                message: "優しい心を持ち続けて。良いことが起こる予感がするわ♪"
            },
            {
                svg: suneoSVG,
                name: "スネ夫",
                fortune: "小吉",
                fortuneClass: "fortune-shokichi",
                message: "小さな幸せを見つけよう。自慢できることがきっとあるはずだよ！"
            },
            {
                svg: gianSVG,
                name: "ジャイアン",
                fortune: "凶",
                fortuneClass: "fortune-kyo",
                message: "おれの物はおれの物！...今日は控えめに過ごそう。心の歌を歌えば元気が出るぞ！"
            },
            {
                svg: senseiSVG,
                name: "先生",
                fortune: "大凶",
                fortuneClass: "fortune-daikyo",
                message: "廊下に立ってなさい！...でも大丈夫、明日はきっと良い日になりますよ。"
            }
        ];

        function drawOmikuji() {
            const resultArea = document.getElementById('resultArea');
            const btn = document.getElementById('drawBtn');
            
            btn.disabled = true;
            btn.textContent = '占い中...';
            
            resultArea.innerHTML = '<div class="initial-icon shaking">🎋</div><p class="initial-message">運勢を占っています...</p>';
            
            setTimeout(() => {
                const result = fortunes[Math.floor(Math.random() * fortunes.length)];
                
                resultArea.innerHTML = `
                    <div class="fade-in">
                        <div class="character-icon">
                            ${result.svg}
                        </div>
                        <div class="character-name">${result.name}</div>
                        <div class="fortune ${result.fortuneClass}">${result.fortune}</div>
                        <div class="message">${result.message}</div>
                    </div>
                `;
                
                btn.disabled = false;
                btn.textContent = 'もう一度引く';
            }, 1000);
        }
    </script>
</body>
</html>
