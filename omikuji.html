<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドラえもん おみくじ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #87CEEB 0%, #00BFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #0066CC;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .result-area {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .character {
            font-size: 100px;
            margin-bottom: 20px;
            animation: bounce 0.5s ease;
        }

        .character-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fortune {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px 30px;
            border-radius: 10px;
            display: inline-block;
        }

        .message {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .fortune-daikichi { color: #FFD700; background: linear-gradient(135deg, #FFF8DC, #FFFACD); }
        .fortune-chukichi { color: #FF6B6B; background: linear-gradient(135deg, #FFE4E1, #FFF0F5); }
        .fortune-kichi { color: #FF69B4; background: linear-gradient(135deg, #FFF0F5, #FFE4E1); }
        .fortune-shokichi { color: #4169E1; background: linear-gradient(135deg, #E6E6FA, #F0F8FF); }
        .fortune-kyo { color: #8B4513; background: linear-gradient(135deg, #F5DEB3, #FFE4C4); }
        .fortune-daikyo { color: #4B0082; background: linear-gradient(135deg, #E6E6FA, #DDA0DD); }

        .draw-button {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .draw-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .draw-button:active {
            transform: translateY(0);
        }

        .initial-message {
            color: #888;
            font-size: 1.2em;
        }

        .initial-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎍 ドラえもん おみくじ 🎍</h1>
        <p class="subtitle">ボタンを押して今日の運勢を占おう！</p>
        
        <div class="result-area" id="resultArea">
            <div class="initial-icon">🔮</div>
            <p class="initial-message">おみくじを引いてね！</p>
        </div>
        
        <button class="draw-button" onclick="drawOmikuji()">おみくじを引く</button>
    </div>

    <script>
        const fortunes = [
            {
                character: "🤖",
                name: "ドラえもん",
                fortune: "大吉",
                class: "fortune-daikichi",
                message: "すばらしい一日になるよ！ひみつ道具のように、あなたの可能性は無限大だ！"
            },
            {
                character: "👦",
                name: "のび太",
                fortune: "中吉",
                class: "fortune-chukichi",
                message: "のんびりいこう！失敗しても大丈夫、きっとうまくいくよ！"
            },
            {
                character: "👧",
                name: "しずか",
                fortune: "吉",
                class: "fortune-kichi",
                message: "優しい心を持ち続けて。良いことが起こる予感がするわ！"
            },
            {
                character: "😏",
                name: "スネ夫",
                fortune: "小吉",
                class: "fortune-shokichi",
                message: "小さな幸せを見つけよう。自慢できることがきっとあるはずだよ！"
            },
            {
                character: "💪",
                name: "ジャイアン",
                fortune: "凶",
                class: "fortune-kyo",
                message: "今日は控えめに過ごそう。心の歌を歌えば元気が出るぞ！"
            },
            {
                character: "👨‍🏫",
                name: "先生",
                fortune: "大凶",
                class: "fortune-daikyo",
                message: "廊下に立ってなさい！...でも大丈夫、明日はきっと良い日になる！"
            }
        ];

        function drawOmikuji() {
            const resultArea = document.getElementById('resultArea');
            
            // ランダムに選ぶ
            const result = fortunes[Math.floor(Math.random() * fortunes.length)];
            
            // 結果を表示
            resultArea.innerHTML = `
                <div class="fade-in">
                    <div class="character">${result.character}</div>
                    <div class="character-name">${result.name}</div>
                    <div class="fortune ${result.class}">${result.fortune}</div>
                    <div class="message">${result.message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
